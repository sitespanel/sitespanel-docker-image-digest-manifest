# Builds, signs and publishes SitesPanel's image digest manifest to
# https://packages.sitespanel.io/images/ (ADR-0034, ADR-0035, ADR-0036 of the
# SitesPanel plan). Every 6 hours it checks the tracked tags and approves new
# digests that pass the scan and their contract; the 00:17 run also re-scans
# every listed digest. A run by hand re-scans everything by default. An image with no approved digest does not fail the run: it is tracked in one issue.
name: manifest
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      rescan_all:
        description: Re-scan digests already listed
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
concurrency:
  group: manifest
  cancel-in-progress: false
env:
  FILE: sitespanel-docker-image-digest-manifest.json
  # Trivy 0.75.0, the newest release at least two weeks old on 2026-10-27.
  TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
      - run: go vet ./... && go test ./...
      - run: go build -o manifest .
      - name: Build and sign
        id: build
        env:
          SITESPANEL_IMAGE_MANIFEST_MINISIGN_SECRET_KEY: ${{ secrets.SITESPANEL_IMAGE_MANIFEST_MINISIGN_SECRET_KEY }}
          RESCAN: ${{ (github.event_name == 'workflow_dispatch' && inputs.rescan_all) || github.event.schedule == '17 0 * * *' }}
        run: |
          mkdir -p "$HOME/.cache/trivy"
          flags=""
          if [ "$RESCAN" = true ]; then flags=-rescan-all; fi
          set +e
          ./manifest build $flags -out out \
            -trivy "docker run --rm -v $HOME/.cache/trivy:/root/.cache/trivy $TRIVY_IMAGE --cache-dir /root/.cache/trivy" | tee summary.md
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3: written, but an image has no approved digest (tracked in an issue below; the run itself stays green).
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]
      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SITESPANEL_PACKAGES_R2_UPLOAD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SITESPANEL_PACKAGES_R2_UPLOAD_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ vars.SITESPANEL_PACKAGES_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.SITESPANEL_PACKAGES_R2_BUCKET }}
        run: |
          # The SBOM documents first: a manifest never names one that is not there yet (TASK-0117).
          if [ -d out/sbom ]; then
            aws s3 cp --recursive --only-show-errors --endpoint-url "$ENDPOINT" --cache-control "max-age=3600" \
              --content-type application/json out/sbom "s3://$BUCKET/images/sbom"
          fi
          # The signature first: a reader between the two writes sees a pair
          # that does not verify and tries again; it never trusts a mismatch.
          for f in "$FILE.minisig" "$FILE"; do
            aws s3 cp --only-show-errors --endpoint-url "$ENDPOINT" --cache-control "max-age=60" \
              --content-type "$(case $f in *.json) echo application/json ;; *) echo text/plain ;; esac)" \
              "out/$f" "s3://$BUCKET/images/$f"
          done
      - name: Check what is served
        run: |
          seq=$(jq -r .sequence "out/$FILE")
          mkdir served
          curl -fsS -o "served/$FILE" "https://packages.sitespanel.io/images/$FILE?v=$seq"
          curl -fsS -o "served/$FILE.minisig" "https://packages.sitespanel.io/images/$FILE.minisig?v=$seq"
          cmp "out/$FILE" "served/$FILE"
          ./manifest verify "served/$FILE"
          # Each SBOM the manifest names is served and has the recorded hash.
          for row in $(jq -r '.images[] | select(.sbom) | .sbom.path + "=" + .sbom.sha256' "out/$FILE"); do
            path=${row%%=*}; want=${row##*=}
            got=$(curl -fsS "https://packages.sitespanel.io/images/$path" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] || { echo "SBOM $path has the wrong hash"; exit 1; }
          done
      # An image with no approved digest is not a failed run: the manifest was built, signed and verified, and the images
      # that passed are listed. It is one open issue that says which images wait for a fixed upstream image or a waiver
      # (security/image-scan-waivers.yaml, at most 30 days, the founder's decision), updated each run and closed when none is left.
      - name: Track images without an approved digest
        if: always() && steps.build.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.build.outputs.code }}
          TITLE: Images without an approved digest
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title==\"$TITLE\"))|.[0].number // empty")
          if [ "$CODE" = 3 ]; then
            { echo "The last run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) listed the images that passed and left out the ones below."
              echo "Each waits for a fixed upstream image, or for a waiver the founder approves (at most 30 days)."
              echo; sed -n '/^\*\*Not listed/,$p;/NOT LISTED/p' summary.md | sort -u | cut -c1-600; } > issue.md
            if [ -n "$number" ]; then gh issue edit "$number" --body-file issue.md
            else gh issue create --title "$TITLE" --body-file issue.md; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every image has an approved digest again (run $GITHUB_RUN_ID)."
          fi
